spec-description: |
  The item shall have a link with the ${pkg-quality-model-role:/spec-name} to
  the quality model.  It shall have the inputs ``clang-analyzer``,
  ``cppcheck``, ``metrixplusplus`` and ``quality-scanner`` with the outputs of
  the analysis tools.  The ``rtems`` inputs shall be the source directories
  of the analysed code.  The ``package-changes`` input shall provide the
  status of the issues for the package.
